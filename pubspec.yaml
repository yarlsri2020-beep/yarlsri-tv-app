
name: yarlsri_tv
description: Yarlsri TV Android and iOS app
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/YARLSRI_App_Icon_White_Blue.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/YARLSRI_App_Icon_White_Blue.jpg

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/YARLSRI_Splash_White_Blue.jpg
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: assets/images/YARLSRI_App_Icon_White_Blue.jpg

